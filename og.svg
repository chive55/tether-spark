<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#0B1224"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B8C3E4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#111A38" stroke-width="1" opacity="0.5">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- left title stack -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800">
    <text x="64" y="210" font-size="78" fill="#FFFFFF" letter-spacing="0.06em">TETHER</text>
    <text x="64" y="300" font-size="78" fill="#53E6FF" filter="url(#glow)" letter-spacing="0.06em">SPARK</text>
  </g>

  <text x="64" y="360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" fill="#B8C3E4" letter-spacing="0.04em">Tap. Tether. Pull the spark.</text>

  <!-- PLAY chip -->
  <rect x="64" y="400" width="220" height="44" rx="8" fill="#53E6FF"/>
  <text x="174" y="430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#070B12" text-anchor="middle" letter-spacing="0.08em">PLAY IN BROWSER</text>

  <!-- right motif: core + tether + sparks -->
  <g transform="translate(860, 315)">
    <!-- range ring -->
    <circle r="140" fill="none" stroke="#53E6FF" stroke-width="2" stroke-dasharray="8 10" opacity="0.35"/>
    <!-- tether line -->
    <line x1="0" y1="0" x2="95" y2="-70" stroke="#53E6FF" stroke-width="4" filter="url(#glow)"/>
    <!-- core -->
    <circle r="28" fill="#53E6FF" filter="url(#softGlow)"/>
    <circle r="12" fill="#FFFFFF"/>
    <!-- sparks -->
    <circle cx="95" cy="-70" r="14" fill="#FFD85A" filter="url(#glow)"/>
    <circle cx="95" cy="-70" r="6" fill="#FFFFFF"/>
    <circle cx="-110" cy="40" r="11" fill="#FFD85A" opacity="0.85"/>
    <circle cx="60" cy="100" r="9" fill="#FFD85A" opacity="0.7"/>
    <circle cx="-40" cy="-120" r="8" fill="#FFD85A" opacity="0.6"/>
  </g>

  <!-- footer -->
  <text x="600" y="590" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#B8C3E4" text-anchor="middle" letter-spacing="0.28em">CHIVE ARCADE</text>
</svg>