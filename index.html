<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tether Spark</title>
  <meta name="description" content="Tap to fire a tether at the nearest spark. Pull it in for points. Miss the range and the line snaps.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tether Spark">
  <meta property="og:description" content="Tap to fire a tether at the nearest spark. Pull it in for points. Miss the range and the line snaps.">
  <meta property="og:url" content="https://nathan-chive-arcade.itch.io/tether-spark">
  <meta property="og:image" content="https://raw.githubusercontent.com/chive55/tether-spark/main/og.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tether Spark">
  <meta name="twitter:description" content="Tap to fire a tether at the nearest spark. Pull it in for points. Miss the range and the line snaps.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/chive55/tether-spark/main/og.svg">
  <link rel="canonical" href="https://nathan-chive-arcade.itch.io/tether-spark">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #080B18; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
      color: #eef2ff;
    }
    #top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    #score { font-variant-numeric: tabular-nums; letter-spacing: 0.08em; font-size: 1.1rem; }
    #best { font-size: 0.85rem; color: #B8C3E4; }
    #mute {
      pointer-events: auto; min-height: 44px; min-width: 44px; padding: 0 12px;
      border: 1px solid #ffffff22; border-radius: 10px; background: #0b0d18cc;
      color: #eef2ff; cursor: pointer; font: inherit;
    }
    #panel {
      pointer-events: auto; text-align: center; background: #0b0d18ee;
      border: 1px solid #53E6FF44; border-radius: 16px; padding: 24px 28px; max-width: 420px;
    }
    #panel h1 { margin: 0 0 8px; letter-spacing: 0.14em; font-size: 1.6rem; color: #53E6FF; }
    #panel p { margin: 0 0 16px; color: #B8C3E4; line-height: 1.4; }
    button.go {
      min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px;
      background: #53E6FF; color: #080B18; font-weight: 700; cursor: pointer; font-size: 1rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="top">
      <div>
        <div id="score">0</div>
        <div id="best">Best 0</div>
      </div>
      <button id="mute" type="button">Sound on</button>
    </div>
    <div id="panel">
      <h1>TETHER SPARK</h1>
      <p>Tap to tether the nearest spark.<br>Pull it in. Miss the range and it snaps.</p>
      <button class="go" id="go" type="button">Play</button>
    </div>
  </div>
  <script>
    const audio = (() => {
      const KEY = 'tether-spark-mute';
      let ctx, master, muted = false, pulseOsc = null, pulseGain = null;
      try { muted = localStorage.getItem(KEY) === '1'; } catch (e) {}

      function ac() {
        if (!ctx) {
          const C = window.AudioContext || window.webkitAudioContext;
          if (!C) return null;
          ctx = new C();
          master = ctx.createGain();
          master.gain.value = muted ? 0 : 0.22;
          master.connect(ctx.destination);
        }
        return ctx;
      }

      function unlock() {
        const c = ac();
        if (c && c.state === 'suspended') c.resume();
      }

      function setMuted(on) {
        muted = !!on;
        try { localStorage.setItem(KEY, muted ? '1' : '0'); } catch (e) {}
        if (master) master.gain.value = muted ? 0 : 0.22;
        if (muted) pulse(false);
      }

      function env(start, peak, dur) {
        const c = ac(); if (!c || muted) return null;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(peak, start + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        g.connect(master);
        return g;
      }

      function tone(freq, type, dur, peak) {
        const c = ac(); if (!c || muted) return;
        const t = c.currentTime;
        const o = c.createOscillator();
        o.type = type || 'square';
        o.frequency.setValueAtTime(freq, t);
        o.connect(env(t, peak || 0.2, dur || 0.12));
        o.start(t);
        o.stop(t + (dur || 0.12) + 0.02);
      }

      function sweep(from, to, type, dur, peak) {
        const c = ac(); if (!c || muted) return;
        const t = c.currentTime;
        const o = c.createOscillator();
        o.type = type || 'sawtooth';
        o.frequency.setValueAtTime(from, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        o.connect(env(t, peak || 0.18, dur));
        o.start(t);
        o.stop(t + dur + 0.02);
      }

      function noise(dur, peak) {
        const c = ac(); if (!c || muted) return;
        const t = c.currentTime;
        const n = Math.max(1, Math.floor(c.sampleRate * dur));
        const buf = c.createBuffer(1, n, c.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
        const src = c.createBufferSource();
        src.buffer = buf;
        const f = c.createBiquadFilter();
        f.type = 'highpass';
        f.frequency.value = 900;
        src.connect(f);
        f.connect(env(t, peak || 0.16, dur));
        src.start(t);
        src.stop(t + dur + 0.02);
      }

      function pulse(on) {
        const c = ac();
        if (!c) return;
        if (!on || muted) {
          if (pulseOsc) { try { pulseOsc.stop(); } catch (e) {} pulseOsc = null; pulseGain = null; }
          return;
        }
        if (pulseOsc) return;
        pulseOsc = c.createOscillator();
        pulseGain = c.createGain();
        pulseOsc.type = 'triangle';
        pulseOsc.frequency.value = 98;
        pulseGain.gain.value = 0.03;
        pulseOsc.connect(pulseGain);
        pulseGain.connect(master);
        pulseOsc.start();
      }

      const api = {
        unlock, setMuted, isMuted: () => muted, pulse,
        start() { tone(392, 'square', 0.08, 0.16); tone(523, 'square', 0.12, 0.14); },
        tap() { tone(660, 'square', 0.06, 0.14); },
        score() { sweep(520, 880, 'square', 0.14, 0.16); },
        miss() { noise(0.08, 0.12); tone(180, 'sawtooth', 0.1, 0.1); },
        die() { pulse(false); sweep(320, 70, 'sawtooth', 0.38, 0.2); noise(0.16, 0.1); }
      };
      window.audio = api;
      return api;
    })();

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const panel = document.getElementById('panel');
    const go = document.getElementById('go');
    const muteBtn = document.getElementById('mute');

    const BG = '#080B18';
    const CYAN = '#53E6FF';
    const GOLD = '#FFD85A';
    const GREEN = '#39D98A';
    const RED = '#FF4D68';
    const MAGENTA = '#FF4FD8';
    const WHITE = '#FFFFFF';
    const GRAY = '#B8C3E4';

    let running = false, score = 0, best = 0, lives = 3;
    let sparks = [], particles = [], tether = null;
    let shake = 0, flash = 0, spawnTimer = 0, range = 0;
    let coreR = 18, rangeBase = 140, rangeMax = 220;
    let dpr = 1, W = 0, H = 0, cx = 0, cy = 0;

    try { best = Number(localStorage.getItem('tether-spark-best') || 0); } catch (e) {}
    bestEl.textContent = 'Best ' + best;

    function resize() {
      dpr = devicePixelRatio || 1;
      W = innerWidth;
      H = innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = W / 2;
      cy = H / 2;
    }
    addEventListener('resize', resize);
    resize();

    muteBtn.textContent = audio.isMuted() ? 'Sound off' : 'Sound on';
    muteBtn.onclick = () => {
      audio.unlock();
      audio.setMuted(!audio.isMuted());
      muteBtn.textContent = audio.isMuted() ? 'Sound off' : 'Sound on';
    };

    function resetGame() {
      score = 0;
      lives = 3;
      sparks = [];
      particles = [];
      tether = null;
      shake = 0;
      flash = 0;
      spawnTimer = 0.4;
      range = rangeBase;
      scoreEl.textContent = '0';
    }

    go.onclick = () => {
      audio.unlock();
      audio.start();
      audio.pulse(true);
      panel.classList.add('hidden');
      running = true;
      resetGame();
    };

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) audio.pulse(false);
      else if (running) { audio.unlock(); audio.pulse(true); }
    });

    function spawnSpark() {
      const ang = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * Math.min(W, H) * 0.38;
      const spd = 18 + Math.random() * 28 + score * 0.4;
      sparks.push({
        x: cx + Math.cos(ang) * dist,
        y: cy + Math.sin(ang) * dist,
        vx: (Math.random() - 0.5) * spd,
        vy: (Math.random() - 0.5) * spd,
        r: 7 + Math.random() * 4,
        life: 1,
        glow: 0.6 + Math.random() * 0.4
      });
    }

    function burst(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 40 + Math.random() * 120;
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 0.35 + Math.random() * 0.35,
          max: 0.7,
          color,
          r: 2 + Math.random() * 3
        });
      }
    }

    function nearestSpark() {
      let bestS = null, bestD = 1e9;
      for (const s of sparks) {
        const dx = s.x - cx, dy = s.y - cy;
        const d = Math.hypot(dx, dy);
        if (d < bestD) { bestD = d; bestS = s; }
      }
      return { spark: bestS, dist: bestD };
    }

    function fireTether() {
      if (!running || tether) return;
      audio.tap();
      const { spark, dist } = nearestSpark();
      if (!spark) {
        audio.miss();
        shake = 6;
        return;
      }
      const inRange = dist <= range + spark.r;
      tether = {
        target: spark,
        t: 0,
        maxT: inRange ? 0.22 : 0.18,
        success: inRange,
        fromX: cx, fromY: cy,
        toX: spark.x, toY: spark.y
      };
      if (!inRange) {
        audio.miss();
        shake = 8;
        lives -= 1;
        flash = 0.25;
        if (lives <= 0) endGame();
      }
    }

    function endGame() {
      running = false;
      audio.die();
      audio.pulse(false);
      if (score > best) {
        best = score;
        try { localStorage.setItem('tether-spark-best', String(best)); } catch (e) {}
        bestEl.textContent = 'Best ' + best;
      }
      panel.querySelector('h1').textContent = 'TETHER SPARK';
      panel.querySelector('p').innerHTML = 'Score <b style="color:#FFD85A">' + score + '</b><br>Best ' + best;
      go.textContent = 'Again';
      panel.classList.remove('hidden');
    }

    function onPointer(e) {
      e.preventDefault();
      if (!running) return;
      fireTether();
    }
    canvas.addEventListener('pointerdown', onPointer, { passive: false });
    addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        if (!running) go.click();
        else fireTether();
      }
    });

    let last = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;

      // clear
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, W, H);

      // subtle grid
      ctx.strokeStyle = '#111A3844';
      ctx.lineWidth = 1;
      const step = 48;
      const ox = (cx % step);
      const oy = (cy % step);
      ctx.beginPath();
      for (let x = ox - step; x < W + step; x += step) {
        ctx.moveTo(x, 0); ctx.lineTo(x, H);
      }
      for (let y = oy - step; y < H + step; y += step) {
        ctx.moveTo(0, y); ctx.lineTo(W, y);
      }
      ctx.stroke();

      if (running) {
        // spawn
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnSpark();
          const base = Math.max(0.28, 0.9 - score * 0.012);
          spawnTimer = base + Math.random() * 0.25;
        }

        // range grows slowly with score then soft caps
        range = Math.min(rangeMax, rangeBase + score * 1.1);

        // update sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          // gentle pull toward center so they stay in play
          const dx = cx - s.x, dy = cy - s.y;
          const d = Math.hypot(dx, dy) || 1;
          s.vx += (dx / d) * 8 * dt;
          s.vy += (dy / d) * 8 * dt;
          // soft bound
          const maxD = Math.min(W, H) * 0.48;
          if (d > maxD) {
            s.vx -= (dx / d) * 40 * dt;
            s.vy -= (dy / d) * 40 * dt;
          }
          s.life -= dt * 0.015;
          if (s.life <= 0) sparks.splice(i, 1);
        }

        // tether
        if (tether) {
          tether.t += dt;
          const p = Math.min(1, tether.t / tether.maxT);
          const ease = p * p * (3 - 2 * p);
          const tx = tether.fromX + (tether.toX - tether.fromX) * ease;
          const ty = tether.fromY + (tether.toY - tether.fromY) * ease;

          // draw tether line
          ctx.save();
          ctx.strokeStyle = tether.success ? CYAN : RED;
          ctx.lineWidth = tether.success ? 3.5 : 2.5;
          ctx.shadowColor = tether.success ? CYAN : RED;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(tx, ty);
          ctx.stroke();
          ctx.restore();

          // tip
          ctx.beginPath();
          ctx.fillStyle = tether.success ? GOLD : RED;
          ctx.arc(tx, ty, 5, 0, Math.PI * 2);
          ctx.fill();

          if (p >= 1) {
            if (tether.success) {
              const s = tether.target;
              const idx = sparks.indexOf(s);
              if (idx >= 0) sparks.splice(idx, 1);
              score += 1;
              scoreEl.textContent = String(score);
              audio.score();
              burst(s.x, s.y, GOLD, 14);
              burst(s.x, s.y, CYAN, 8);
              shake = 5;
              // small range reward
              range = Math.min(rangeMax, range + 2);
            } else {
              burst(tether.toX, tether.toY, RED, 8);
            }
            tether = null;
          }
        }

        // particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
        }

        if (shake > 0) shake = Math.max(0, shake - dt * 40);
        if (flash > 0) flash = Math.max(0, flash - dt);
      }

      // camera shake
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      // range ring (only while running)
      if (running) {
        ctx.beginPath();
        ctx.strokeStyle = CYAN + '33';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 8]);
        ctx.arc(cx, cy, range, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // core
      const coreGlow = 10 + Math.sin(now * 0.006) * 4;
      ctx.beginPath();
      ctx.fillStyle = CYAN;
      ctx.shadowColor = CYAN;
      ctx.shadowBlur = coreGlow;
      ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.fillStyle = WHITE;
      ctx.arc(cx, cy, coreR * 0.45, 0, Math.PI * 2);
      ctx.fill();

      // sparks
      for (const s of sparks) {
        const g = 8 + s.glow * 10;
        ctx.beginPath();
        ctx.fillStyle = GOLD;
        ctx.shadowColor = GOLD;
        ctx.shadowBlur = g;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.fillStyle = WHITE;
        ctx.arc(s.x, s.y, s.r * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }

      // particles
      for (const p of particles) {
        const a = Math.max(0, p.life / p.max);
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // lives pips
      if (running) {
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.fillStyle = i < lives ? GREEN : '#ffffff22';
          ctx.arc(cx - 28 + i * 28, cy + coreR + 28, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // flash
      if (flash > 0) {
        ctx.fillStyle = RED + Math.floor(flash * 80).toString(16).padStart(2, '0');
        ctx.fillRect(0, 0, W, H);
      }

      ctx.restore();
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
