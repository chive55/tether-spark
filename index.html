<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tether Spark</title>
  <meta name="description" content="Sparks fly at the core. Tap when they enter the ring. Miss the range and the line snaps.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tether Spark">
  <meta property="og:description" content="Sparks fly at the core. Tap when they enter the ring. Miss the range and the line snaps.">
  <meta property="og:url" content="https://nathan-chive-arcade.itch.io/tether-spark">
  <meta property="og:image" content="https://raw.githubusercontent.com/chive55/tether-spark/main/og.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tether Spark">
  <meta name="twitter:description" content="Sparks fly at the core. Tap when they enter the ring. Miss the range and the line snaps.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/chive55/tether-spark/main/og.svg">
  <link rel="canonical" href="https://nathan-chive-arcade.itch.io/tether-spark">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #07080f; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
      color: #eef2ff;
    }
    #top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    #score, #lives, #best { font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }
    #mute {
      pointer-events: auto; min-height: 44px; min-width: 44px; padding: 0 12px;
      border: 1px solid #ffffff22; border-radius: 10px; background: #0b0d18cc;
      color: #eef2ff; cursor: pointer; font: inherit;
    }
    #panel {
      pointer-events: auto; text-align: center; background: #0b0d18cc;
      border: 1px solid #ffffff22; border-radius: 16px; padding: 24px 28px; max-width: 420px;
    }
    #panel h1 { margin: 0 0 8px; letter-spacing: 0.12em; }
    #panel p { margin: 0 0 16px; color: #b7c0e0; }
    button.go {
      min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px;
      background: #53E6FF; color: #0b0c14; font-weight: 700; cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="top">
      <div>
        <div id="score">0</div>
        <div id="best">BEST 0</div>
      </div>
      <div id="lives">● ● ●</div>
      <button id="mute" type="button">Sound on</button>
    </div>
    <div id="panel">
      <h1>TETHER SPARK</h1>
      <p>Tap when a spark enters the cyan ring. Early tap or a core hit costs a life.</p>
      <button class="go" id="go" type="button">Play</button>
    </div>
  </div>
  <script>
    const audio = (() => {
      const KEY = 'tether-spark-mute';
      let ctx, master, muted = false, pulseOsc = null, pulseGain = null;
      try { muted = localStorage.getItem(KEY) === '1'; } catch (e) {}
      function ac() {
        if (!ctx) {
          const C = window.AudioContext || window.webkitAudioContext;
          if (!C) return null;
          ctx = new C();
          master = ctx.createGain();
          master.gain.value = muted ? 0 : 0.22;
          master.connect(ctx.destination);
        }
        return ctx;
      }
      function unlock() { const c = ac(); if (c && c.state === 'suspended') c.resume(); }
      function setMuted(on) {
        muted = !!on;
        try { localStorage.setItem(KEY, muted ? '1' : '0'); } catch (e) {}
        if (master) master.gain.value = muted ? 0 : 0.22;
        if (muted) pulse(false);
      }
      function env(start, peak, dur) {
        const c = ac(); if (!c || muted) return null;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(peak, start + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        g.connect(master);
        return g;
      }
      function tone(freq, type, dur, peak) {
        const c = ac(); if (!c || muted) return;
        const t = c.currentTime;
        const o = c.createOscillator();
        o.type = type || 'square';
        o.frequency.setValueAtTime(freq, t);
        o.connect(env(t, peak || 0.2, dur || 0.12));
        o.start(t);
        o.stop(t + (dur || 0.12) + 0.02);
      }
      function sweep(from, to, type, dur, peak) {
        const c = ac(); if (!c || muted) return;
        const t = c.currentTime;
        const o = c.createOscillator();
        o.type = type || 'sawtooth';
        o.frequency.setValueAtTime(from, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
        o.connect(env(t, peak || 0.18, dur));
        o.start(t);
        o.stop(t + dur + 0.02);
      }
      function noise(dur, peak) {
        const c = ac(); if (!c || muted) return;
        const t = c.currentTime;
        const n = Math.max(1, Math.floor(c.sampleRate * dur));
        const buf = c.createBuffer(1, n, c.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
        const src = c.createBufferSource();
        src.buffer = buf;
        const f = c.createBiquadFilter();
        f.type = 'highpass';
        f.frequency.value = 900;
        src.connect(f);
        f.connect(env(t, peak || 0.16, dur));
        src.start(t);
        src.stop(t + dur + 0.02);
      }
      function pulse(on) {
        const c = ac();
        if (!c) return;
        if (!on || muted) {
          if (pulseOsc) { try { pulseOsc.stop(); } catch (e) {} pulseOsc = null; pulseGain = null; }
          return;
        }
        if (pulseOsc) return;
        pulseOsc = c.createOscillator();
        pulseGain = c.createGain();
        pulseOsc.type = 'triangle';
        pulseOsc.frequency.value = 98;
        pulseGain.gain.value = 0.03;
        pulseOsc.connect(pulseGain);
        pulseGain.connect(master);
        pulseOsc.start();
      }
      const api = {
        unlock, setMuted, isMuted: () => muted, pulse,
        start() { tone(392, 'square', 0.08, 0.16); tone(523, 'square', 0.12, 0.14); },
        tap() { tone(660, 'square', 0.06, 0.14); },
        score() { sweep(520, 880, 'square', 0.14, 0.16); },
        miss() { noise(0.08, 0.12); tone(180, 'sawtooth', 0.1, 0.1); },
        die() { pulse(false); sweep(320, 70, 'sawtooth', 0.38, 0.2); noise(0.16, 0.1); }
      };
      window.audio = api;
      return api;
    })();

    const canvas = document.getElementById('c');
    const g = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const bestEl = document.getElementById('best');
    const panel = document.getElementById('panel');
    const go = document.getElementById('go');
    const muteBtn = document.getElementById('mute');

    let running = false, score = 0, lives = 3, best = 0;
    let sparks = [], particles = [], shake = 0, flash = 0, spawnT = 0, last = 0;
    try { best = Number(localStorage.getItem('tether-spark-best') || 0); } catch (e) {}
    bestEl.textContent = 'BEST ' + best;

    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
    }
    addEventListener('resize', resize);
    resize();

    function cx() { return canvas.width / 2; }
    function cy() { return canvas.height / 2; }
    function scale() { return Math.min(canvas.width, canvas.height); }
    function ringR() { return scale() * 0.18; }
    function coreR() { return scale() * 0.046; }
    function spawnR() { return scale() * 0.48; }

    function saveBest() {
      if (score > best) {
        best = score;
        try { localStorage.setItem('tether-spark-best', String(best)); } catch (e) {}
        bestEl.textContent = 'BEST ' + best;
      }
    }
    function paintLives() {
      livesEl.textContent = ['●','●','●'].map((_, i) => i < lives ? '●' : '○').join(' ');
    }
    function spawnSpark() {
      const a = Math.random() * Math.PI * 2;
      const r = spawnR();
      const speed = (0.22 + score * 0.012 + Math.random() * 0.06) * scale();
      sparks.push({
        x: cx() + Math.cos(a) * r,
        y: cy() + Math.sin(a) * r,
        vx: -Math.cos(a) * speed,
        vy: -Math.sin(a) * speed,
        pulled: false, dead: false
      });
    }
    function burst(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = (0.04 + Math.random() * 0.18) * scale();
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
      }
    }
    function dist(s) {
      const dx = s.x - cx(), dy = s.y - cy();
      return Math.hypot(dx, dy);
    }
    function fire() {
      if (!running) return;
      audio.tap();
      const ring = ringR();
      const inner = ring * 0.62;
      let bestS = null, bestD = 1e9;
      for (const s of sparks) {
        if (s.dead || s.pulled) continue;
        const d = dist(s);
        if (d < bestD) { bestD = d; bestS = s; }
      }
      if (!bestS || bestD > ring || bestD < inner) {
        audio.miss();
        shake = 8; flash = 0.25;
        lives -= 1;
        paintLives();
        if (lives <= 0) die();
        return;
      }
      bestS.pulled = true;
      score += 1;
      scoreEl.textContent = String(score);
      saveBest();
      audio.score();
      burst(bestS.x, bestS.y, '#53E6FF', 12);
    }
    function die() {
      running = false;
      audio.die();
      shake = 16; flash = 0.55;
      saveBest();
      panel.querySelector('p').textContent = 'Score ' + score + ' · Best ' + best;
      go.textContent = 'Restart';
      panel.classList.remove('hidden');
    }
    function startGame() {
      audio.unlock();
      audio.start();
      audio.pulse(true);
      panel.classList.add('hidden');
      running = true;
      score = 0; lives = 3;
      sparks = []; particles = [];
      spawnT = 0.35; shake = 0; flash = 0;
      scoreEl.textContent = '0';
      paintLives();
    }
    muteBtn.textContent = audio.isMuted() ? 'Sound off' : 'Sound on';
    muteBtn.onclick = () => {
      audio.unlock();
      audio.setMuted(!audio.isMuted());
      muteBtn.textContent = audio.isMuted() ? 'Sound off' : 'Sound on';
    };
    go.onclick = startGame;
    canvas.addEventListener('pointerdown', (e) => {
      if (!running) return;
      e.preventDefault();
      fire();
    });
    addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (running) fire();
        else startGame();
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) audio.pulse(false);
      else if (running) { audio.unlock(); audio.pulse(true); }
    });
    function loop(t) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.033, last ? (t - last) / 1000 : 0.016);
      last = t;
      if (running) {
        spawnT -= dt;
        const interval = Math.max(0.42, 1.05 - score * 0.03);
        if (spawnT <= 0) { spawnSpark(); spawnT = interval; }
        for (const s of sparks) {
          if (s.dead) continue;
          if (s.pulled) {
            const dx = cx() - s.x, dy = cy() - s.y;
            s.x += dx * 8 * dt;
            s.y += dy * 8 * dt;
            if (Math.hypot(dx, dy) < coreR() * 0.6) s.dead = true;
          } else {
            s.x += s.vx * dt;
            s.y += s.vy * dt;
            if (dist(s) <= coreR()) {
              s.dead = true;
              audio.miss();
              shake = 10; flash = 0.3;
              lives -= 1;
              paintLives();
              burst(s.x, s.y, '#ff5d7a', 14);
              if (lives <= 0) die();
            }
          }
        }
        sparks = sparks.filter(s => !s.dead);
      }
      for (const p of particles) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 2.2;
      }
      particles = particles.filter(p => p.life > 0);
      if (shake > 0) shake *= 0.86;
      if (flash > 0) flash -= dt;
      const ox = (Math.random() - 0.5) * shake * devicePixelRatio;
      const oy = (Math.random() - 0.5) * shake * devicePixelRatio;
      g.setTransform(1, 0, 0, 1, ox, oy);
      g.fillStyle = '#07080f';
      g.fillRect(-20, -20, canvas.width + 40, canvas.height + 40);
      const R = ringR();
      g.beginPath();
      g.arc(cx(), cy(), R, 0, Math.PI * 2);
      g.strokeStyle = '#53E6FF88';
      g.lineWidth = 3 * devicePixelRatio;
      g.stroke();
      g.beginPath();
      g.arc(cx(), cy(), R * 0.62, 0, Math.PI * 2);
      g.strokeStyle = '#53E6FF33';
      g.lineWidth = 2 * devicePixelRatio;
      g.stroke();
      g.beginPath();
      g.arc(cx(), cy(), coreR(), 0, Math.PI * 2);
      g.fillStyle = '#53E6FF';
      g.fill();
      g.beginPath();
      g.arc(cx(), cy(), coreR() * 0.45, 0, Math.PI * 2);
      g.fillStyle = '#eef2ff';
      g.fill();
      for (const s of sparks) {
        if (s.pulled) {
          g.beginPath();
          g.moveTo(cx(), cy());
          g.lineTo(s.x, s.y);
          g.strokeStyle = '#53E6FFcc';
          g.lineWidth = 2 * devicePixelRatio;
          g.stroke();
        }
        g.beginPath();
        g.arc(s.x, s.y, coreR() * 0.38, 0, Math.PI * 2);
        g.fillStyle = s.pulled ? '#53E6FF' : '#ffb14a';
        g.fill();
      }
      for (const p of particles) {
        g.globalAlpha = Math.max(0, p.life);
        g.fillStyle = p.color;
        g.fillRect(p.x, p.y, 3 * devicePixelRatio, 3 * devicePixelRatio);
        g.globalAlpha = 1;
      }
      if (flash > 0) {
        g.fillStyle = 'rgba(255,93,122,' + (flash * 0.35) + ')';
        g.fillRect(0, 0, canvas.width, canvas.height);
      }
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
